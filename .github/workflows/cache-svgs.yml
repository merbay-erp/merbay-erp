name: Cache 3rd-party SVGs

# 3rd-party SVG'leri cache'le + GitHub API'den kendi stats.svg/top-langs.svg
# uret. Vercel 503 olsa bile profil profesyonel gozukur.
#
# Maliyet: $0 (GitHub-hosted runner + raw.githubusercontent.com)

on:
  schedule:
    - cron: '0 */4 * * *'  # her 4 saatte
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-svgs.yml'
      - '.github/workflows/scripts/gen-stats.sh'

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (script source)
        uses: actions/checkout@v4
        with:
          path: main-src

      - name: Checkout output branch (target)
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-target

      - name: Fetch 3rd-party SVGs (cache best-effort)
        working-directory: output-target
        run: |
          set -uo pipefail
          mkdir -p svg-cache

          chmod +x ../main-src/.github/workflows/scripts/fetch-svg.sh
          FETCH=../main-src/.github/workflows/scripts/fetch-svg.sh

          $FETCH "https://capsule-render.vercel.app/api?type=waving&color=gradient&customColorList=12&height=200&section=header&text=Mustafa%20Erbay&fontSize=58&fontColor=ffffff&animation=fadeIn&fontAlignY=38&desc=System%20Architect%20%E2%80%A2%20Network%20%26%20Infrastructure%20%E2%80%A2%20Indie%20Hacker&descAlignY=62&descAlign=50&descSize=14" \
            svg-cache/header.svg

          $FETCH "https://capsule-render.vercel.app/api?type=waving&color=gradient&customColorList=12&height=80&section=footer" \
            svg-cache/footer.svg

          $FETCH "https://github-readme-streak-stats.herokuapp.com/?user=merbay-erp&theme=tokyonight&hide_border=true" \
            svg-cache/streak.svg

          $FETCH "https://github-readme-activity-graph.vercel.app/graph?username=merbay-erp&theme=tokyo-night&hide_border=true&area=true&radius=12" \
            svg-cache/activity.svg

          $FETCH "https://github-profile-trophy.vercel.app/?username=merbay-erp&theme=tokyonight&no-frame=true&no-bg=true&row=1&column=7&margin-w=10" \
            svg-cache/trophies.svg

      - name: Generate custom stats.svg + top-langs.svg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x main-src/.github/workflows/scripts/gen-stats.sh
          main-src/.github/workflows/scripts/gen-stats.sh merbay-erp output-target/svg-cache
          ls -la output-target/svg-cache/

      - name: Commit + push to output branch
        working-directory: output-target
        run: |
          git config user.name "SVG Cache Bot"
          git config user.email "bot@mustafaerbay.com.tr"
          git add svg-cache/
          if git diff --staged --quiet; then
            echo "Hiç değişiklik yok, commit atlandı"
            exit 0
          fi
          git commit -m "chore(svg): cache + gen SVGs ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin output
