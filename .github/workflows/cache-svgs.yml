name: Cache profile SVGs

# Cache decorative SVGs and generate repository-owned stats cards.
# The profile only references assets that are known to exist on the output branch.

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-svgs.yml'
      - '.github/workflows/scripts/gen-stats.sh'

permissions:
  contents: write

jobs:
  cache:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          path: main-src

      - name: Checkout output branch
        uses: actions/checkout@v4
        with:
          ref: output
          path: output-target

      - name: Cache decorative SVGs
        working-directory: output-target
        run: |
          set -uo pipefail
          mkdir -p svg-cache

          chmod +x ../main-src/.github/workflows/scripts/fetch-svg.sh
          FETCH=../main-src/.github/workflows/scripts/fetch-svg.sh

          $FETCH "https://capsule-render.vercel.app/api?type=waving&color=gradient&customColorList=12&height=200&section=header&text=Mustafa%20Erbay&fontSize=58&fontColor=ffffff&animation=fadeIn&fontAlignY=38&desc=System%20Architect%20%E2%80%A2%20Network%20%26%20Infrastructure%20%E2%80%A2%20Indie%20Hacker&descAlignY=62&descAlign=50&descSize=14" \
            svg-cache/header.svg

          $FETCH "https://capsule-render.vercel.app/api?type=waving&color=gradient&customColorList=12&height=80&section=footer" \
            svg-cache/footer.svg

      - name: Generate repository-owned stats cards
        env:
          GH_TOKEN: ${{ secrets.METRICS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x main-src/.github/workflows/scripts/gen-stats.sh
          main-src/.github/workflows/scripts/gen-stats.sh merbay-erp output-target/svg-cache
          ls -la output-target/svg-cache/

      - name: Commit and push to output branch
        working-directory: output-target
        run: |
          git config user.name "SVG Cache Bot"
          git config user.email "bot@mustafaerbay.com.tr"
          git add svg-cache/
          if git diff --staged --quiet; then
            echo "No SVG changes; skipping commit"
            exit 0
          fi
          git commit -m "chore(svg): refresh profile assets ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin output
