name: Generate profile dashboard

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cache-svgs.yml'
      - '.github/workflows/scripts/gen-stats.sh'

permissions:
  contents: write

concurrency:
  group: profile-dashboard
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          path: main-src

      - name: Checkout output branch
        uses: actions/checkout@v7
        with:
          ref: output
          path: output-target

      - name: Generate repository-owned profile assets
        env:
          GH_TOKEN: ${{ secrets.METRICS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          chmod +x main-src/.github/workflows/scripts/gen-stats.sh
          main-src/.github/workflows/scripts/gen-stats.sh merbay-erp output-target/svg-cache
          test -s output-target/svg-cache/hero.svg
          test -s output-target/svg-cache/dashboard.svg
          test -s output-target/svg-cache/github-stats.svg
          test -s output-target/svg-cache/capabilities.svg
          test -s output-target/svg-cache/architecture.svg
          test -s output-target/svg-cache/products.svg
          test -s output-target/svg-cache/footer.svg

      - name: Commit dashboard assets
        working-directory: output-target
        run: |
          git config user.name "Profile Dashboard Bot"
          git config user.email "bot@mustafaerbay.com.tr"
          git add svg-cache/
          if git diff --staged --quiet; then
            echo "No dashboard changes; skipping commit"
            exit 0
          fi
          git commit -m "chore(profile): refresh engineering dashboard ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin output
