name: Update README

# Refresh only the Latest writing block from the RSS feed.
# The rest of README.md remains untouched.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update latest writing
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://mustafaerbay.com.tr/rss.xml'
          max_post_count: 5
          template: '$newline- **[$title]($url)** <sub>— $date</sub>'
          date_format: 'mmm d, yyyy'
          comment_tag_name: 'BLOG-POST-LIST'
          commit_message: 'chore(readme): update latest writing'
