name: Update README

# Refresh only the Latest field notes block from the RSS feed.
# The rest of README.md remains untouched.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-writing
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Update latest field notes
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: 'https://mustafaerbay.com.tr/rss.xml'
          max_post_count: 5
          template: '$newline- **[$title]($url)** <sub>— $date</sub>'
          date_format: 'mmm d, yyyy'
          comment_tag_name: 'BLOG-POST-LIST'
          commit_message: 'chore(readme): update latest field notes'
