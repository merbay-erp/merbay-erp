name: Generate Snake

# Contribution graph'i bir yilan animasyonu yapip output branch'ine yaz.
# README'de <img src=".../output/snake.svg"> ile cekiliyor.
# Maliyet: $0.

on:
  schedule:
    - cron: '0 0 * * *'  # gunluk gece yarisi UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: merbay-erp
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
