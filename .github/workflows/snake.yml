name: Generate Snake

# Contribution graph'i bir yilan animasyonu yapip output branch'ine yaz.
# output dalindaki dashboard varliklarini korur; yalnizca snake dosyalarini gunceller.
# Maliyet: $0.

on:
  schedule:
    - cron: '0 0 * * *'  # gunluk gece yarisi UTC
  workflow_dispatch:

permissions:
  contents: write

# Dashboard ve snake ayni output dalina yazdigi icin push islemlerini siraya al.
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        id: snake
        with:
          github_user_name: merbay-erp
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Checkout output branch
        uses: actions/checkout@v7
        with:
          ref: output
          path: output-target

      - name: Preserve dashboard and update snake assets
        run: |
          test -s output-target/svg-cache/hero.svg
          test -s output-target/svg-cache/dashboard.svg
          test -s output-target/svg-cache/github-stats.svg
          test -s output-target/svg-cache/architecture.svg
          test -s output-target/svg-cache/footer.svg
          install -m 0644 dist/snake.svg output-target/snake.svg
          install -m 0644 dist/snake-dark.svg output-target/snake-dark.svg

      - name: Commit snake assets
        working-directory: output-target
        run: |
          git config user.name "Profile Assets Bot"
          git config user.email "bot@mustafaerbay.com.tr"
          git add snake.svg snake-dark.svg
          if git diff --staged --quiet; then
            echo "No snake changes; skipping commit"
            exit 0
          fi
          git commit -m "chore(profile): refresh contribution snake ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push origin output
